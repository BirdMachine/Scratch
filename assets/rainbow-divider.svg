<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-labelledby="title desc">
  <title id="title">Maximum README Energy</title>
  <desc id="desc">A violently colorful rainbow gradient banner.</desc>
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1493"/>
      <stop offset=".16" stop-color="#ff3b00"/>
      <stop offset=".32" stop-color="#ffe600"/>
      <stop offset=".48" stop-color="#00ff88"/>
      <stop offset=".64" stop-color="#00e5ff"/>
      <stop offset=".80" stop-color="#3867ff"/>
      <stop offset="1" stop-color="#c000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="990" height="120" rx="34" fill="url(#rainbow)"/>
  <rect x="13" y="13" width="974" height="104" rx="27" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 7" opacity=".85"/>
  <text x="500" y="60" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#fff" filter="url(#glow)">MAXIMUM README ENERGY</text>
  <text x="500" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">✦ CHROMATIC CONTAINMENT FAILURE ✦</text>
</svg>
